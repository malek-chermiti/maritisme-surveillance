<div class="map-page">
  <div class="map-header">
    <div class="map-header-left">
      <h2>Zone de surveillance</h2>
      <p>Dessinez un rectangle sur la carte pour définir la zone active.</p>
      <span *ngIf="statusMessage" class="status-badge" [class.saving]="isSaving">{{ statusMessage }}</span>
    </div>

    <div class="map-header-actions">
      <button class="detail-btn" (click)="openZoneDetails()">Détails</button>
    </div>
  </div>

  <div id="map" class="map-container"></div>
  <app-zone-dialog *ngIf="showDialog && dialogZone" [zone]="dialogZone" (closeDialog)="closeDialog()"></app-zone-dialog>
</div>
