<div class="dialog-overlay" (click)="onClose()">
  <div class="dialog-box" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h3>Zone sélectionnée</h3>
      <button class="close-btn" (click)="onClose()">&times;</button>
    </div>

    <div class="zone-bounds">
      <div class="bound-row">
        <span class="label">Latitude min</span>
        <span class="value">{{ zone.lat_min | number:'1.4-4' }}</span>
      </div>
      <div class="bound-row">
        <span class="label">Latitude max</span>
        <span class="value">{{ zone.lat_max | number:'1.4-4' }}</span>
      </div>
      <div class="bound-row">
        <span class="label">Longitude min</span>
        <span class="value">{{ zone.lon_min | number:'1.4-4' }}</span>
      </div>
      <div class="bound-row">
        <span class="label">Longitude max</span>
        <span class="value">{{ zone.lon_max | number:'1.4-4' }}</span>
      </div>
    </div>
  </div>
</div>
